- description: "P3 - viento apenas sobre el límite: rechaza y no persiste"
  vars:
    question: "Quiero calendarizar una cita el 2026-10-07"
    reference: "La cita no se calendariza porque un viento superior a 28 km/h produce condiciones NO SEGURO / PROHIBIDO."
    fixed_today: "2026-09-30"
    weather_fixture: '{"temperature_c":25,"precipitation_mm":0,"cloud_cover_pct":10,"visibility_m":10000,"wind_speed_kmh":28.01,"wind_gust_kmh":30}'
    required_tools: '[{"name":"weather_tool","origin":"agent:WeatherWorker","error":false}]'
    forbidden_tools: '[{"name":"calendarizar_cita"},{"name":"schedule_tool"}]'
    expected_created_appointments: 0
  assert:
    - type: regex
      value: '(NO SEGURO|PROHIBIDO|no fue calendarizada)'
    - type: javascript
      value: file://${configDir}/../assertions.js:toolCallsAndAppointments

